<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klassen – [SITE-NAAM]</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="docent" data-pagina="dashboard">
  <header class="docent-kop">
    <a class="docent-merk" href="dashboard.html" data-site-naam>[SITE-NAAM]</a>
    <nav class="docent-nav" aria-label="Hoofdmenu">
      <a href="dashboard.html" aria-current="page">Klassen</a>
      <a href="voortgang.html">Voortgang</a>
      <a href="lessen.html">Lessen</a>
      <a href="uitleg.html">Uitleg</a>
    </nav>
    <p class="docent-gebruiker">
      <span id="docent-email"></span>
      <button id="uitlog-knop" type="button" class="knop knop-klein knop-secundair">Uitloggen</button>
    </p>
  </header>

  <main class="docent-inhoud">
    <h1>Mijn klassen</h1>

    <section class="kaart" aria-labelledby="nieuwe-klas-kop">
      <h2 id="nieuwe-klas-kop">Nieuwe klas aanmaken</h2>
      <form id="klas-formulier" novalidate>
        <div class="formulier-rij">
          <div>
            <label class="veldlabel" for="klas-naam">Naam van de klas</label>
            <input id="klas-naam" class="veld" type="text" maxlength="120" autocomplete="off" placeholder="Basisschool De Toren, groep 7b">
          </div>
          <div>
            <label class="veldlabel" for="klas-toegang">Toegang</label>
            <select id="klas-toegang" class="veld"></select>
          </div>
          <div>
            <button type="submit" class="knop">Klas aanmaken</button>
          </div>
        </div>
        <p id="klas-melding" class="melding" role="status" hidden></p>
      </form>
    </section>

    <p id="lijst-status" class="melding" role="status">Even laden…</p>
    <div id="klassen-lijst" class="kaart-lijst"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
