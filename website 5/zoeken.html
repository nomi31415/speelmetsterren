<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e2c">
  <title>Zoeken – [SITE-NAAM]</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="leerling" data-pagina="zoeken">
  <main class="kolom">
    <a class="tekstlink" href="leerling.html">Terug naar je lessen</a>
    <h1>Zoeken</h1>

    <form id="zoek-formulier" class="zoek-formulier" role="search" novalidate>
      <label class="visueel-verborgen" for="zoekterm">Waar ben je nieuwsgierig naar?</label>
      <input id="zoekterm" class="veld" type="search" maxlength="60" autocomplete="off" placeholder="Waar ben je nieuwsgierig naar?">
      <button type="submit" class="knop">Zoek</button>
    </form>

    <p id="zoek-status" class="melding" role="status"></p>
    <ul id="resultaten" class="resultaten"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/student.js"></script>
  <script src="js/zoeken.js"></script>
</body>
</html>
