<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e2c">
  <title>[SITE-NAAM] – Ontdek de ruimte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="leerling welkom" data-pagina="index">
  <main class="welkom-inhoud">
    <h1 class="site-titel" data-site-naam>[SITE-NAAM]</h1>

    <section id="code-stap" class="paneel">
      <form id="code-formulier" novalidate>
        <label class="stap-label" for="code">Vul de code van je klas in</label>
        <input
          id="code"
          name="code"
          class="veld code-veld"
          type="text"
          inputmode="text"
          enterkeyhint="go"
          maxlength="6"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          placeholder="Klascode"
          aria-describedby="code-fout"
        >
        <p id="code-fout" class="melding fout" role="alert" hidden></p>
        <div class="knoppen" style="margin-top: 1.25rem">
          <button type="submit" class="knop knop-groot">Start</button>
        </div>
      </form>
    </section>

    <section id="bevestig-stap" class="paneel" aria-live="polite" hidden>
      <p class="stap-label" style="margin-bottom: 0">Is dit jouw klas?</p>
      <p id="klas-naam" class="klas-naam"></p>
      <div class="knoppen">
        <button id="bevestig-knop" type="button" class="knop knop-groot">Ja, dit is mijn klas</button>
        <button id="andere-knop" type="button" class="knop knop-groot knop-secundair">Dit is niet mijn klas</button>
      </div>
    </section>

    <nav class="onderlinks" aria-label="Meer informatie">
      <a href="docenten/login.html">Voor docenten</a>
      <a href="over.html">Over <span data-site-naam>[SITE-NAAM]</span></a>
    </nav>
  </main>

  <footer>
    <p class="privacy-regel">We slaan je naam en klas op, zodat je ingelogd blijft.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/student.js"></script>
  <script src="js/code-check.js"></script>
</body>
</html>
